<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ColourWhirl | Redirecting...</title>
    <script>
      // Redirect direct path requests to HashRouter on GitHub Pages
      (function() {
        var path = window.location.pathname;
        // Strip repo name prefix if present
        var route = path.replace(/^\/ColourWhirl\/?/, '');
        var target = '/ColourWhirl/#' + (route ? '/' + route : '') + window.location.search + window.location.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/ColourWhirl/">ColourWhirl</a>...</p>
  </body>
</html>
